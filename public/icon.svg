<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#orangeGrad)"/>
  
  <!-- Subtle plate / radial accent -->
  <circle cx="256" cy="256" r="185" fill="#c2410c" opacity="0.45"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" opacity="0.8"/>
  
  <!-- Breakbite Logo Graphics: Stylized B merged with Fork + Clock Hands -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Big Bold 'B' -->
    <path d="M160 130 h110 c45 0 80 28 80 65 c0 25 -16 46 -38 56 c28 10 48 34 48 64 c0 42 -37 72 -88 72 h-112 Z m64 54 v48 h42 c18 0 30 -10 30 -24 c0 -15 -12 -24 -30 -24 Z m0 98 v56 h48 c22 0 35 -11 35 -28 c0 -17 -13 -28 -35 -28 Z"/>
    
    <!-- Speed lightning tick in Amber -->
    <path d="M375 200 L415 256 L385 256 L405 315 L355 245 L380 245 Z" fill="#fde047"/>
    
    <!-- Clock needle accent -->
    <circle cx="256" cy="256" r="8" fill="#f97316"/>
  </g>
  
  <!-- Dine-in badge ribbon at bottom -->
  <rect x="146" y="390" width="220" height="42" rx="21" fill="#ffffff" filter="url(#shadow)"/>
  <text x="256" y="419" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ea580c" letter-spacing="3">DINE IN</text>
</svg>
